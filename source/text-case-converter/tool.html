<div class="mf-wrap">
<div class="mf-in">
<label for="in">Your text</label>
<textarea id="in" rows="8" spellcheck="false" autocomplete="off" placeholder="Type or paste here"></textarea>
<label for="opt-case">Convert to</label><select id="opt-case"><option value="uppercase">Uppercase</option><option value="lowercase">Lowercase</option><option value="title" selected>Title</option><option value="sentence">Sentence</option><option value="camel">Camel</option><option value="pascal">Pascal</option><option value="snake">Snake</option><option value="kebab">Kebab</option><option value="constant">Constant</option><option value="alternating">Alternating</option></select>
<div class="mf-bar">
<button type="button" id="run">Update result</button>
<button type="button" id="sample" class="mf-ghost">Try an example</button>
<button type="button" id="copy" class="mf-ghost">Copy result</button>
<button type="button" id="clear" class="mf-ghost">Clear</button>
</div>
<p class="mf-status" id="status" role="status"></p>
</div>
<div class="mf-out" aria-live="polite">
<span class="mf-label">Result</span>
<pre class="mf-code" id="out" tabindex="0"></pre>
</div>
</div>
<script>
(function () {
  var $ = function (id) { return root.querySelector("#" + id); };
  function convert(text, o) {
    var words = function (s) { return s.match(/[A-Z]+(?=[A-Z][a-z])|[A-Z]?[a-z]+|[A-Z]+|[0-9]+/g) || []; };
    var cap = function (w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); };
    switch (o.case) {
      case "uppercase": return text.toUpperCase();
      case "lowercase": return text.toLowerCase();
      case "title": return text.replace(/[A-Za-z]+(?:'[A-Za-z]+)?/g, cap);
      case "sentence": return text.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); });
      case "camel": return words(text).map(function (w, i) { return i === 0 ? w.toLowerCase() : cap(w); }).join("");
      case "pascal": return words(text).map(cap).join("");
      case "snake": return words(text).map(function (w) { return w.toLowerCase(); }).join("_");
      case "kebab": return words(text).map(function (w) { return w.toLowerCase(); }).join("-");
      case "constant": return words(text).map(function (w) { return w.toUpperCase(); }).join("_");
      default:
        var n = 0;
        return text.replace(/[A-Za-z]/g, function (c) { return (n++ % 2 === 0) ? c.toLowerCase() : c.toUpperCase(); });
    }
  }
  function options() { return { case: $("opt-case").value }; }
  function update() {
    var r;
    try { r = convert($("in").value, options()); } catch (e) { r = "Something went wrong. Please check your input."; }
    $("out").textContent = String(r);
    $("status").textContent = $("in").value ? "" : "Type or paste text above.";
  }
  $("in").addEventListener("input", update);
    $("opt-case").addEventListener("change", update);
  $("run").addEventListener("click", update);
  $("sample").addEventListener("click", function () { $("in").value = "the quick brown fox"; update(); $("status").textContent = "Example loaded."; });
  $("clear").addEventListener("click", function () { $("in").value = ""; update(); $("in").focus(); });
  $("copy").addEventListener("click", function () {
    var t = $("out").textContent, st = $("status");
    var ok = function () { st.textContent = "Result copied."; };
    var no = function () { st.textContent = "Copy is blocked in this browser. Select the result and copy it."; };
    try { navigator.clipboard.writeText(t).then(ok, no); } catch (e) { no(); }
  });
  update();
})();
</script>
