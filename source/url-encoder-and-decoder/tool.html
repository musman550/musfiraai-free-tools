<div class="mf-wrap">
<div class="mf-in">
<label for="in">Your text</label>
<textarea id="in" rows="8" spellcheck="false" autocomplete="off" placeholder="Type or paste here"></textarea>
<label for="opt-mode">Mode</label><select id="opt-mode"><option value="encode" selected>Encode</option><option value="decode">Decode</option></select>
<label for="opt-scope">Encode scope</label><select id="opt-scope"><option value="component" selected>Component</option><option value="full">Full</option></select>
<div class="mf-bar">
<button type="button" id="run">Update result</button>
<button type="button" id="sample" class="mf-ghost">Try an example</button>
<button type="button" id="copy" class="mf-ghost">Copy result</button>
<button type="button" id="clear" class="mf-ghost">Clear</button>
</div>
<p class="mf-status" id="status" role="status"></p>
</div>
<div class="mf-out" aria-live="polite">
<span class="mf-label">Result</span>
<pre class="mf-code" id="out" tabindex="0"></pre>
</div>
</div>
<script>
(function () {
  var $ = function (id) { return root.querySelector("#" + id); };
  function convert(text, o) {
    if (text === "") return "";
    var hex = function (n) { return ("0" + n.toString(16)).slice(-2).toUpperCase(); };
    if (o.mode === "encode") {
      var keep = o.scope === "full" ? /^[A-Za-z0-9\-_.!~*'();,\/?:@&=+$#]$/ : /^[A-Za-z0-9\-_.!~*'()]$/;
      var bytes = new TextEncoder().encode(text), out = "";
      for (var i = 0; i < bytes.length; i++) {
        var ch = String.fromCharCode(bytes[i]);
        out += (bytes[i] < 128 && keep.test(ch)) ? ch : "%" + hex(bytes[i]);
      }
      return out;
    }
    if (/%(?![0-9A-Fa-f]{2})/.test(text)) return "Invalid URL encoding";
    var chars = Array.from(text), arr = [], enc = new TextEncoder();
    for (var j = 0; j < chars.length; j++) {
      if (chars[j] === "%") { arr.push(parseInt(chars[j + 1] + chars[j + 2], 16)); j += 2; }
      else { var e = enc.encode(chars[j]); for (var k = 0; k < e.length; k++) arr.push(e[k]); }
    }
    try { return new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(new Uint8Array(arr)); }
    catch (err) { return "Invalid URL encoding"; }
  }
  function options() { return { mode: $("opt-mode").value, scope: $("opt-scope").value }; }
  function update() {
    var r;
    try { r = convert($("in").value, options()); } catch (e) { r = "Something went wrong. Please check your input."; }
    $("out").textContent = String(r);
    $("status").textContent = $("in").value ? "" : "Type or paste text above.";
  }
  $("in").addEventListener("input", update);
    $("opt-mode").addEventListener("change", update);
  $("opt-scope").addEventListener("change", update);
  $("run").addEventListener("click", update);
  $("sample").addEventListener("click", function () { $("in").value = "https://example.com/a b?x=1&y=\u00e9"; update(); $("status").textContent = "Example loaded."; });
  $("clear").addEventListener("click", function () { $("in").value = ""; update(); $("in").focus(); });
  $("copy").addEventListener("click", function () {
    var t = $("out").textContent, st = $("status");
    var ok = function () { st.textContent = "Result copied."; };
    var no = function () { st.textContent = "Copy is blocked in this browser. Select the result and copy it."; };
    try { navigator.clipboard.writeText(t).then(ok, no); } catch (e) { no(); }
  });
  update();
})();
</script>
